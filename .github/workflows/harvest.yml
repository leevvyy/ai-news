name: Harvest

# Nightly: news feeds/APIs → data/raw/<date>.json and prices → data/market/prices.csv.
# Runs where the internet is reachable (the routine's sandbox is not), before the 21:48 UTC
# (05:48 UTC+8) routine, which reads the newest result with `python3 -m ainews raw`.
# GitHub starts schedules best-effort. The 21:07 UTC slot started 3h15m-3h32m late on each of
# 2026-10-01..03 (00:22-00:39 UTC), after the routine. Two slots keep a harvest under ~3 h old at
# 21:48 for any delay up to ~3.6 h: 20:37 serves a punctual scheduler, 17:37 a late one.
# Each run writes data/raw/<UTC+8 date>.json (both slots share a date) and commits only on change.
on:
  schedule:
    - cron: "37 17 * * *"  # 01:37 UTC+8
    - cron: "37 20 * * *"  # 04:37 UTC+8
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test the selected branch's harvester against the live feeds; commit nothing"
        type: boolean
        default: false
      inspect:
        description: "Dry run only: space-separated URLs whose first 8 KB to print, as the harvester receives them"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The sandbox the routine (and Claude) work in cannot reach news hosts, so feed changes are proven here:
      # Actions → Harvest → Run workflow → pick the branch, tick dry_run. The feed status table is in the log.
      - name: Dry run (no commit)
        if: ${{ inputs.dry_run }}
        env:
          INSPECT: ${{ inputs.inspect }}
        run: |
          python -m ainews harvest --no-prices || true
          python - <<'EOF'
          import json, os, pathlib
          from ainews.harvest import fetch
          raw = json.loads(sorted(pathlib.Path("data/raw").glob("*.json"))[-1].read_text("utf-8"))
          for f in raw["feeds"]:
              print(f"{'ok  ' if f['ok'] else 'FAIL'} {f['n']:>4}  {f['name']}  {f.get('note') or f.get('error') or ''}")
          for url in os.environ["INSPECT"].split():
              print(f"\n===== {url}")
              try:
                  print(fetch(url)[:8192].decode("utf-8", "replace"))
              except Exception as exc:
                  print(f"{type(exc).__name__}: {exc}")
          EOF
      - name: Harvest, re-render, verify, commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ai-daily-harvester"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m ainews harvest || echo "::warning::harvest reported failures, see the log above"
            python -m ainews render
            python -m ainews check
            git add data/raw data/market issues artifacts
            if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
            git commit -q -m "harvest: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected on attempt $attempt; retrying on a fresh main"
            sleep 15
          done
          exit 1
