# Research checklist and domain → tier map.
#
# This is NOT an allow-list: the routine may cite any credible outlet. It serves two purposes:
#   1. RUNBOOK.md step 2 walks these groups so coverage is consistent day to day.
#   2. ainews/validate.py warns when an item labels a known domain with a different tier.
#
# tier: primary = the organisation's own channel (blog, paper, model card, filing, government doc)
#       press   = established newsroom          trade = specialist media / newsletters
#       social  = community platforms (signal only, never sole support for a lead)

