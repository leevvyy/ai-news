# Nightly harvester sources (ainews/harvest.py, run by .github/workflows/harvest.yml).
#
# kind:   rss    RSS 2.0 / RSS 1.0 / Atom feed
#         gnews  Google News search feed for `query` in `locale` (en | zh); outlet comes from <source>
#         hf     Hugging Face daily papers API (upvotes as a signal)
#         hn     Hacker News stories via the Algolia API (points/comments as signals)
# filter: true keeps only items that match the AI keyword pattern (for general tech/business feeds)
# tier/lang follow sources.toml. Every run records per-feed status in data/raw/<date>.json → "feeds",
# so a dead URL shows up there instead of failing silently. Edit freely; no code changes needed.

# ---- labs & primary --------------------------------------------------------
