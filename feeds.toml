# ---- Google News (breadth: many outlets per story) ---------------------------
[[feed]]
name = "Google News · AI"
kind = "gnews"
query = "artificial intelligence OR LLM OR \"AI model\""
locale = "en"
tier = "press"
lang = "en"

[[feed]]
name = "Google News · labs"
kind = "gnews"
query = "OpenAI OR Anthropic OR \"Google DeepMind\" OR xAI OR \"Meta AI\" OR Mistral"
locale = "en"
tier = "press"
lang = "en"

[[feed]]
