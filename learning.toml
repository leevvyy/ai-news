# Learning track: the gaps each issue's "Learn this" items teach towards (read by ainews/learn.py).
#
# `short` is the dashboard rail label (defaults to `label`).
# Scale: 1 aware · 2 guided · 3 independent · 4 rigorous / hireable at a strong shop · 5 top practitioner.
# Scores are the owner's capability-audit estimates (2026-10-26). Re-score monthly; nothing else needs editing.
#
#   priority_d = (target_d - now_d) * weight_d
#
# `weight` is relevance to the goal (model-level depth and evaluation highest). `keywords` are matched,
# case-insensitively, against each story's title, summary and why_it_matters to find today's hooks.

[learn]
max_items = 3          # learn items per issue (RUNBOOK asks for 1-3)
recency_tau_days = 4.0 # a gap taught Δ days ago is damped by 1 - exp(-Δ / τ), so the track rotates
tracker_days = 30      # look-back of the tracker table

[[gap]]
id = "ai-off-fluency"
label = "AI-off fluency"
now = 2.5              # unmeasured: the audit's P0 probes replace this placeholder
target = 4.0
weight = 1.0
keywords = ["pytorch", "transformer", "attention", "backprop", "gradient", "softmax", "layernorm", "from scratch"]

[[gap]]
id = "llm-internals"
label = "LLM internals & post-training"
short = "LLM internals"
now = 2.5
target = 4.5
weight = 1.0
keywords = ["kv cache", "kv-cache", "quantiz", "tokeni", "fine-tun", "lora", "sft", "rlhf", "dpo", "grpo",
            "reinforcement", "distill", "mixture-of-experts", "moe", "context window", "inference", "forgetting",
            "continual learning", "open-weight", "parameters", "flash"]

